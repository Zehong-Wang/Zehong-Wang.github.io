short_bio: >-
  <p>
    I am a third year Ph.D. student (2023 Fall - Present) in Computer Science and Engineering at <a href="https://www.nd.edu/">University of Notre Dame</a> advised by <a href="http://yes-lab.org/">Prof. Yanfang (Fanny) Ye</a>.  
    My research focuses on developing generalizable AI systems that integrate multimodal data for scientific discovery. 
    Recently, I have been working on scientific foundation models and AI agents, with the goal of building AI scientists for drug discovery and public health.
  </p>
  <ul>

    <li>
      <strong>Essence of Graph Learning:</strong>
      graph foundation model, graph pattern machine, self-supervised learning, heterogeneous graph, temporal graph, hypergraph, etc. (<a href="https://arxiv.org/abs/2505.15116">Survey</a>, <a href="https://arxiv.org/abs/2411.06070">GFT</a>, <a href="https://arxiv.org/abs/2412.16441">GIT</a>, <a href="https://arxiv.org/abs/2501.18739">GPM</a>, <a href="https://openreview.net/forum?id=tdMWo3jB21">G2PM</a>, <a href="https://arxiv.org/abs/2601.22454">TGPM</a>).
    </li>

    <li>
      <strong>Essence of Agentic AI:</strong>
      planning, memory, multimodality, RAG, tool usage, agent collaboration, self-evolving, etc. (<a href="https://arxiv.org/abs/2601.22311">FLARE</a>, <a href="https://arxiv.org/abs/2601.02598">LongDA</a>, <a href="https://arxiv.org/abs/2505.15859">AutoData</a>, <a href="https://arxiv.org/abs/2510.05445">AgentRouter</a>, <a href="https://arxiv.org/abs/2510.15961">LAMI</a>, <a href="https://arxiv.org/abs/2601.22384">GSubstrate</a>).
    </li>
        
    <li>
      <strong>AI for Scientific Discovery:</strong> 
      drug discovery, AI scientist, public health, deep research, social science, etc. (<a href="https://arxiv.org/abs/2509.19580">Survey</a>, <a href="https://arxiv.org/abs/2510.10402">TreeDiff</a>, <a href="https://arxiv.org/abs/2601.22327">MolField</a>, <a href="https://arxiv.org/abs/2602.07075">LatentChem</a>, <a href="https://arxiv.org/abs/2602.12373">Policy4OOD</a>, <a href="https://aclanthology.org/2025.acl-long.296/">NGQA</a>).
    </li>
  </ul>

  <p>
    Feel free to reach out me via email, wechat, or linkedin if you have any questions, explore potential collaborations, or just for talk! 😊
  </p>

